<ul class="blog-compact">
{% for post in site.posts %}
{% if post.hidden != true %}
  <li class="blog-compact-item">
    <a class="blog-compact-link" href="{{ post.url }}">{{ post.title }}</a>
    <time class="blog-compact-date" datetime="{{ post.date }}" title="{{ post.date | date: '%B %d, %Y' }}">{{ post.date | date: "%b %Y" }}</time>
  </li>
{% endif %}
{% endfor %}
</ul>

<style>
.blog-compact {
  list-style: none;
  margin: 0;
  padding: 0;
}

.blog-compact-item {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 1px solid #eee;
}

.blog-compact-link {
  font-size: 14px;
  line-height: 1.35;
}

.blog-compact-date {
  flex-shrink: 0;
  font-size: 11px;
  color: #999;
  white-space: nowrap;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
</style>
